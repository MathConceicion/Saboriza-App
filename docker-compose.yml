services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: saboriza-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gastronomia
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gastronomia"]
      interval: 5s
      timeout: 3s
      retries: 10

  webapi:
    build:
      context: .
      dockerfile: src/WebAPI/Dockerfile
    container_name: saboriza-webapi
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=gastronomia;Username=postgres;Password=postgres
      Jwt__Issuer: gastronomia-marketplace
      Jwt__Audience: gastronomia-marketplace-client
      Jwt__SecretKey: ${JWT_SECRET_KEY:?JWT_SECRET_KEY ausente}
      Jwt__ExpiracaoMinutos: 60
      Jwt__RefreshExpiracaoDias: 7
      ApplyMigrations: "false"
      AllowedOrigins__0: http://localhost:5173
      AllowedOrigins__1: http://frontend
      DataProtection__KeyPath: /app/keys
    ports:
      - "5178:8080"
    volumes:
      - ./keys:/app/keys
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: saboriza-frontend
    restart: unless-stopped
    depends_on:
      webapi:
        condition: service_healthy
    environment:
      VITE_API_URL: http://localhost:5178
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
